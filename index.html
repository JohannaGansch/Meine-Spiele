<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J.G. – Meine Spiele</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
<a class="brand" href="./"><span class="logo">J.G.</span><span>Meine Spiele</span></a>
<nav>
<button class="nav active" data-filter="all">Alle</button>
<button class="nav" data-filter="dino">🦖 Dinosaurier</button>
<button class="nav" data-filter="bird">🐦 Vögel</button>
</nav>
<a class="github" href="https://github.com/JohannaGansch/Meine-Spiele" target="_blank">GitHub ↗</a>
</header>

<main>
<section class="hero">
<div>
<p class="eyebrow">J.G. • UNITY • SPIELE</p>
<h1>Meine Spiele</h1>
<p>Willkommen in Johannas Spielewelt! Hier können später ihre Unity-Spiele mit Bildern, Beschreibungen und Versionen angezeigt werden.</p>
</div>
<div class="symbols">🦕 <span>·</span> 🐦</div>
</section>

<section class="tools">

<button id="refresh">↻ Aktualisieren</button>
</section>

<section>
<div class="heading"><h2 id="title">Alle Spiele</h2><span id="count">0</span></div>
<div id="status">Lade Spiele aus GitHub…</div>
<div id="cards" class="cards"></div>
</section>
</main>

<footer><b>J.G.</b> · Johannas Spiele · <span id="updated">Noch nicht geladen</span></footer>
<script src="script.js"></script>

</html>
